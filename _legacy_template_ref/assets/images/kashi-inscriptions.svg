<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none" stroke="currentColor">
  <rect x="10" y="10" width="380" height="220" rx="6" stroke-width="1" opacity="0.3" />

  <!-- Carved Lithic Stone Inscription Slab Outline -->
  <rect x="35" y="30" width="330" height="180" rx="4" stroke-width="1.5" stroke-dasharray="4 2" />
  <rect x="42" y="37" width="316" height="166" rx="2" stroke-width="0.75" opacity="0.4" />

  <!-- Engraved Sanskrit Epigraph (Nagari & Brahmi Inscription lines) -->
  <g font-family="'Cormorant Garamond', serif" fill="currentColor" stroke="none">
    <text x="60" y="65" font-size="14" font-weight="bold" letter-spacing="1">काशी के अप्रकाशित शिलालेख · Inscriptions of Kashi Project</text>
    <text x="60" y="95" font-size="12" letter-spacing="3" opacity="0.85">ॐ संवत् १६७२ वर्षे कार्त्तिक मासे शुक्ल पक्षे...</text>
    <text x="60" y="120" font-size="12" letter-spacing="3" opacity="0.75">वारणसी क्षेत्रे भागीरथी तीरे मन्दिर प्रतिष्ठा...</text>
    <text x="60" y="145" font-size="12" letter-spacing="3" opacity="0.75">धर्म्मकीर्त्तिः सदा स्थास्यति यावच्चन्द्रदिवाकरौ...</text>
    
    <!-- Ancient Brahmi script watermark line -->
    <text x="60" y="175" font-size="16" letter-spacing="8" opacity="0.5">𑀲 𑀢 𑀫 𑀥 𑀁 𑀫 𑀮𑀺 𑀔𑀺 𑀢 𑀓 𑀸 𑀰𑀻</text>
  </g>

  <!-- Estampage Paper Corner Clips -->
  <path d="M35,50 L55,30 M345,30 L365,50 M35,190 L55,210 M345,210 L365,190" stroke-width="1.2" opacity="0.5" />
</svg>
