<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none" stroke="currentColor">
  <!-- Archaeological Trench Stratigraphy Profile -->
  <rect x="10" y="10" width="380" height="220" rx="6" stroke-width="1" opacity="0.3" />
  
  <!-- Stratum Layer 1: Surface Humus -->
  <path d="M10,45 Q100,50 200,42 T390,48" stroke-width="1.2" />
  <text x="25" y="35" font-family="monospace" font-size="9" fill="currentColor" stroke="none" opacity="0.6">STRATUM I: SURFACE DEPOSIT (0.00 - 0.35m)</text>

  <!-- Stratum Layer 2: Mature Harappan / Intermediate -->
  <path d="M10,95 Q110,88 210,102 T390,92" stroke-width="1.2" />
  <text x="25" y="80" font-family="monospace" font-size="9" fill="currentColor" stroke="none" opacity="0.6">STRATUM II: EARLY URBAN TRANSITION</text>

  <!-- Stratum Layer 3: Pre-Harappan Hakra / Kunal Phase -->
  <path d="M10,155 Q90,165 210,148 T390,160" stroke-width="1.5" stroke="var(--accent)" />
  <rect x="20" y="102" width="360" height="50" fill="currentColor" opacity="0.05" stroke="none" />
  <text x="25" y="132" font-family="'Cormorant Garamond', serif" font-weight="bold" font-size="13" fill="currentColor" stroke="none">कुणाल प्राक-हड़प्पा स्तर · Pre-Harappan Horizon (2023–24)</text>
  <text x="25" y="148" font-family="monospace" font-size="9" fill="currentColor" stroke="none" opacity="0.7">Trench KNL-04 · Mud-brick structures &amp; steatite beads</text>

  <!-- Stratum Layer 4: Natural Virgin Soil -->
  <text x="25" y="195" font-family="monospace" font-size="9" fill="currentColor" stroke="none" opacity="0.5">STRATUM IV: NATURAL VIRGIN SILT</text>
  
  <!-- Trench Measurement Rod / Scale -->
  <line x1="365" y1="20" x2="365" y2="220" stroke-width="1.5" />
  <rect x="362" y="20" width="6" height="20" fill="currentColor" opacity="0.8" />
  <rect x="362" y="60" width="6" height="20" fill="currentColor" opacity="0.8" />
  <rect x="362" y="100" width="6" height="20" fill="currentColor" opacity="0.8" />
  <rect x="362" y="140" width="6" height="20" fill="currentColor" opacity="0.8" />
  <rect x="362" y="180" width="6" height="20" fill="currentColor" opacity="0.8" />
</svg>
