<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none" stroke="currentColor">
  <rect x="10" y="10" width="380" height="220" rx="6" stroke-width="1" opacity="0.3" />

  <!-- Painted Grey Ware (PGW) Ceramic Profile & Dish Silhouette -->
  <g transform="translate(200, 115)">
    <!-- Open shallow dish outline -->
    <path d="M-130,-40 C-100,20 -40,45 0,45 C40,45 100,20 130,-40" stroke-width="2" />
    <path d="M-130,-40 C-100,16 -40,40 0,40 C40,40 100,16 130,-40" stroke-width="0.8" stroke-dasharray="2 3" />
    <path d="M-45,45 C-30,52 30,52 45,45" stroke-width="2" />

    <!-- Painted Black Geometric Concentric Bands -->
    <path d="M-105,-15 Q0,10 105,-15" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.75" />
    <path d="M-80,5 Q0,25 80,5" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.75" />
    
    <!-- Central Solar / Dot motif in interior -->
    <circle cx="0" cy="22" r="5" fill="currentColor" opacity="0.6" />
    <circle cx="0" cy="22" r="10" stroke-width="0.8" opacity="0.6" />
  </g>

  <!-- Descriptive Archaeological Labels -->
  <text x="25" y="35" font-family="'Cormorant Garamond', serif" font-weight="bold" font-size="14" fill="currentColor" stroke="none">चित्रित धूसर मृद्भाण्ड (PGW) · Kurdi, Baghpat (2024–25)</text>
  <text x="25" y="52" font-family="monospace" font-size="9" fill="currentColor" stroke="none" opacity="0.7">Iron Age Horizon · Fine grey fabric with black geometric slips</text>
  <text x="25" y="210" font-family="monospace" font-size="9" fill="currentColor" stroke="none" opacity="0.6">DIAMETER: 26.2 cm · FABRIC: LEVIGATED CLAY · FIRING: REDUCING</text>
</svg>
